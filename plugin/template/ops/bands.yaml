# Closing the loop (Stage 6: Maintain). A deterministic script watches one metric and invokes Claude
# only when a control band is breached. The tier decides what Claude may do. No model in the detection path.
metric: ci_test_failure_rate
baseline: rolling_30d
rules: western_electric
tiers:
  1sigma: { action: log }
  2sigma: { action: diagnose,
            tools: "Read,Grep,Bash(gh run view *)" }
  3sigma: { action: propose,
            routes: [pull_request, runbook:rollback-deploy] }
