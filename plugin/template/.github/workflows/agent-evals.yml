# Continuous evals (Stage 4: Test). Runs whenever the configuration that steers the agent changes, and nightly.
# Needs ANTHROPIC_API_KEY in repository secrets with budget for eval runs. The plugin is installed because
# its hooks (protect tests during a fix, no secrets in the diff) are part of what the suite tests.
name: Agent evals
on:
  pull_request:
    paths: ['CLAUDE.md', 'REVIEW.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: |
          claude plugin marketplace add jsnkle/ai-native-sdlc
          claude plugin install ai-native-sdlc@jsnkle --scope user
      - name: Smoke-test the project hooks on this runner
        # Project hooks run in claude -p without workspace trust (verified); only the permissions
        # allow list is trust-gated, which is why run.sh passes --allowedTools from each eval.
        run: |
          set +e
          printf '{"tool_input":{"command":"deploy to production"}}' | .claude/hooks/production-gate.sh; echo "production-gate exit=$? (expect 2)"
          printf '{"tool_input":{"file_path":"%s/migrations/x.sql"}}' "$PWD" | CLAUDE_PROJECT_DIR=$PWD .claude/hooks/protected-paths.sh; echo "protected-paths exit=$? (expect 2 with the default list)"
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: evals/run.sh
      - name: Keep agent transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/.result-*.json
          if-no-files-found: ignore
