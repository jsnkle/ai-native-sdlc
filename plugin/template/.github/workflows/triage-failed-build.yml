# Stage 5: Deploy, CI/CD integration. A read-only judgment step: when the build fails, Claude reads the log
# and posts a three-line triage to the PR thread. No write access to the repo.
# Needs ANTHROPIC_API_KEY. Replace `make build` and out/build.log with your real build. Where ci.yml already
# builds on every PR, fold the triage steps into that job instead of running the build twice.
name: Build
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - name: Build
        id: build
        run: |
          mkdir -p out
          make build 2>&1 | tee out/build.log
          exit ${PIPESTATUS[0]}
      - name: Triage failed build
        if: failure() && steps.build.outcome == 'failure'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Read the build log at out/build.log. Identify the most
          likely cause, say whether the failure looks flaky or real, and write a
          three-line summary for the PR thread." --allowedTools "Read" >> triage.md
      - name: Post triage
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file triage.md
